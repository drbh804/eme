<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — Elegant Middle East</title>
<meta name="description" content="One company, three specialised divisions. How Elegant Middle East plans, builds and operates national-scale events and temporary venues in Saudi Arabia.">
<meta property="og:title" content="About — Elegant Middle East">
<meta property="og:description" content="One company, three specialised divisions. How Elegant Middle East plans, builds and operates national-scale events and temporary venues in Saudi Arabia.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/img-01.jpg">
<meta name="theme-color" content="#FBF8F6">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&family=Readex+Pro:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1100px 700px at 12% -8%, rgba(230,194,175,0.55), transparent 62%), radial-gradient(900px 620px at 92% 8%, rgba(188,133,101,0.34), transparent 60%), radial-gradient(1000px 800px at 50% 108%, rgba(122,64,80,0.16), transparent 66%), #FBF8F6; background-attachment: fixed; }
  a { color: #4E2A36; text-decoration: none; }
  a:hover { color: #BC8565; }
  @keyframes emeMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  ::selection { background: #E6C2AF; color: #4E2A36; }
  a, button { transition: background 0.3s cubic-bezier(0.16,1,0.3,1), color 0.3s, box-shadow 0.35s cubic-bezier(0.16,1,0.3,1), transform 0.35s cubic-bezier(0.16,1,0.3,1), border-color 0.3s; }
  a[href]:hover, button:hover { transform: translateY(-2px); }
  a[href]:active, button:active { transform: translateY(0); }

  [data-motion] [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1), transform 0.9s cubic-bezier(0.16,1,0.3,1); }
  [data-motion] [data-reveal][data-in] { opacity: 1; transform: none; }
  [data-motion] [data-w] { display: inline-block; opacity: 0; transform: translateY(0.55em); transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1), transform 0.75s cubic-bezier(0.16,1,0.3,1); }
  [data-motion] [data-w][data-in] { opacity: 1; transform: none; }
  [data-motion] [data-scale] { transform: scale(1.07); transition: transform 1.3s cubic-bezier(0.16,1,0.3,1); }
  [data-motion] [data-scale][data-in] { transform: scale(1); }
  @media (prefers-reduced-motion: reduce) { [data-motion] [data-reveal], [data-motion] [data-w], [data-motion] [data-scale] { opacity: 1 !important; transform: none !important; } }

  [dir="rtl"], [dir="rtl"] * { letter-spacing: normal !important; }
  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { text-transform: none; }
  [dir="rtl"] p, [dir="rtl"] span, [dir="rtl"] a { overflow-wrap: break-word; }
  @media (max-width: 700px) {
    [data-process] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 10px !important; }
    [data-process] > div { padding: 16px 14px 18px !important; gap: 10px !important; }
  }
  html, body { max-width: 100%; overflow-x: clip; }
  section[id] { scroll-margin-top: 100px; }
  @media (max-width: 900px) { section[id] { scroll-margin-top: 152px; } }
  @media (max-width: 560px) { section[id] { scroll-margin-top: 196px; } }
</style>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</helmet>
<div data-page dir="{{ dir }}" style="font-family: {{ fontStack }}; color: #2A1A20; background: transparent; min-height: 100vh;">
  <dc-import name="SiteHeader" lang="{{ lang }}" active="about" on-toggle-lang="{{ toggleLang }}" hint-size="100%,72px"></dc-import>

  <section style="position: relative; overflow: hidden;">
    <div style="position: relative; max-width: 1440px; margin: 0 auto; padding: clamp(34px, 3.6vw, 62px) 40px clamp(20px, 2.2vw, 34px);">
      <p data-reveal style="display: inline-flex; align-items: center; gap: 9px; margin: 0 0 24px; padding: 8px 16px 8px 10px; border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #4E2A36;"><span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: rgba(188,133,101,0.24);"><i data-lucide="building-2" style="width: 12px; height: 12px;"></i></span>{{ kicker }}</p>
      <h1 data-split style="text-transform: uppercase; margin: 0; font-size: clamp(32px, 3.8vw, 58px); line-height: {{ headLH }}; font-weight: 300; letter-spacing: -0.04em; color: #4E2A36; max-width: 16ch; font-family: {{ headingFont }}; text-wrap: balance;">{{ pageTitle }}</h1>
      <p data-reveal style="margin: 18px 0 0; font-size: clamp(15px, 1.15vw, 18px); line-height: {{ bodyLH }}; font-weight: 300; color: #5B4650; max-width: 58ch;">{{ pageLede }}</p>
    </div>
  </section>

  <section style="max-width: 1440px; margin: 0 auto; padding: 0 40px clamp(24px, 2.6vw, 44px);">
    <span data-scale style="position: relative; display: block; aspect-ratio: 21 / 9; max-height: 420px; border-radius: 26px; overflow: hidden; box-shadow: 0 16px 44px rgba(78,42,54,0.16);"><img src="assets/img-14.jpg" alt="Site briefing at sunrise, Riyadh" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
      <span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(42,26,32,0.55) 0%, transparent 52%);"></span>
    </span>
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: 0 32px clamp(56px, 7vw, 104px);">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: clamp(12px, 1.2vw, 20px);">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
        <div data-reveal style="display: flex; flex-direction: column; gap: 12px; padding: clamp(24px, 2.4vw, 34px) clamp(22px, 2.2vw, 30px) clamp(26px, 2.6vw, 36px); border-radius: 22px; background: rgba(255,255,255,0.5); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 30px rgba(78,42,54,0.08), inset 0 1px 0 rgba(255,255,255,0.85);">
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: rgba(188,133,101,0.18); color: #4E2A36;"><i data-lucide="{{ s.icon }}" style="width: 20px; height: 20px;"></i></span>
          <span data-count style="font-family: {{ headingFont }}; font-size: {{ s.size }}; font-weight: 300; letter-spacing: -0.05em; color: #4E2A36; line-height: 0.95;">{{ s.value }}</span>
          <span style="font-size: 12px; line-height: 1.5; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7A5B66;">{{ s.label }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="background: rgba(243,233,227,0.45); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); padding: clamp(34px, 3.8vw, 60px) 0;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px;">
      <p style="margin: 0 0 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #BC8565;">{{ whyKicker }}</p>
      <h2 data-split style="text-transform: uppercase; margin: 0 0 52px; font-size: clamp(28px, 3.2vw, 48px); line-height: {{ headLH }}; font-weight: 300; letter-spacing: -0.025em; color: #4E2A36; max-width: 22ch; font-family: {{ headingFont }};">{{ whyTitle }}</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px;">
        <sc-for list="{{ why }}" as="w" hint-placeholder-count="6">
          <div data-reveal style="display: flex; align-items: flex-start; gap: 18px; padding: 26px 26px 28px; border-radius: 20px; background: rgba(255,255,255,0.5); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 30px rgba(78,42,54,0.08), inset 0 1px 0 rgba(255,255,255,0.85);">
            <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 13px; background: rgba(188,133,101,0.18); color: #4E2A36; flex-shrink: 0;"><i data-lucide="{{ w.icon }}" style="width: 22px; height: 22px;"></i></span>
            <span style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
              <span style="font-size: clamp(16px, 1.4vw, 19px); font-weight: 500; letter-spacing: -0.01em; color: #4E2A36; line-height: 1.25;">{{ w.title }}</span>
              <span style="font-size: 14px; line-height: 1.5; font-weight: 300; color: #7A5B66;">{{ w.body }}</span>
            </span>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="padding: clamp(30px, 3.2vw, 52px) 0; overflow: hidden; direction: ltr;">
    <div style="height: 1px; background: rgba(78,42,54,0.14); margin-bottom: clamp(22px, 2.4vw, 38px);"></div>
    <div style="direction: ltr; display: flex; width: max-content; animation: emeMarquee 40s linear infinite;">
      <sc-for list="{{ valuesLoop }}" as="v" hint-placeholder-count="12">
        <span style="padding: 0 clamp(20px, 2.6vw, 40px); font-size: clamp(15px, 1.5vw, 21px); font-weight: 500; letter-spacing: 0.02em; color: rgba(78,42,54,0.4); white-space: nowrap;">{{ v }}</span>
      </sc-for>
    </div>
    <div style="height: 1px; background: rgba(78,42,54,0.14); margin-top: clamp(32px, 4vw, 52px);"></div>
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: 0 32px clamp(64px, 8vw, 128px);">
    <p style="margin: 0 0 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #BC8565;">{{ processKicker }}</p>
    <h2 data-split style="text-transform: uppercase; margin: 0 0 56px; font-size: clamp(28px, 3.2vw, 48px); line-height: {{ headLH }}; font-weight: 300; letter-spacing: -0.025em; color: #4E2A36; max-width: 24ch; font-family: {{ headingFont }};">{{ processTitle }}</h2>
    <div data-process style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 1.2vw, 20px);">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="6">
        <div data-reveal style="display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: clamp(18px, 1.8vw, 26px) clamp(18px, 1.8vw, 26px) clamp(20px, 2vw, 28px); border-radius: 20px; background: rgba(255,255,255,0.5); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 30px rgba(78,42,54,0.08), inset 0 1px 0 rgba(255,255,255,0.85);">
          <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 13px; background: rgba(188,133,101,0.18); color: #4E2A36; flex-shrink: 0;"><i data-lucide="{{ st.icon }}" style="width: 22px; height: 22px;"></i></span>
          <span style="font-size: clamp(15px, 1.3vw, 19px); font-weight: 500; letter-spacing: -0.01em; color: #4E2A36; line-height: 1.25;">{{ st.title }}</span>
          <span style="font-size: 13px; line-height: 1.55; font-weight: 300; color: #7A5B66;">{{ st.body }}</span>
        </div>
      </sc-for>
    </div>
  </section>


  <section style="max-width: 1280px; margin: 0 auto; padding: 0 32px clamp(40px, 4.4vw, 72px);">
    <div style="background: rgba(255,255,255,0.55); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 34px rgba(78,42,54,0.10), inset 0 1px 0 rgba(255,255,255,0.85); border-radius: 34px; padding: clamp(44px, 6vw, 88px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 36px; align-items: center;">
      <h2 data-split style="text-transform: uppercase; margin: 0; font-size: clamp(25px, 2.7vw, 42px); line-height: {{ headLH }}; font-weight: 300; letter-spacing: -0.03em; color: #4E2A36; font-family: {{ headingFont }}; text-wrap: balance;">{{ ctaTitle }}</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 12px;">
        <a href="contact.html" style="padding: 17px 34px; border-radius: 999px; background: #4E2A36; color: #FBF8F6; font-size: 15px; font-weight: 600;" style-hover="background: #7A4050; color: #FBF8F6; box-shadow: 0 10px 28px rgba(122,64,80,0.42);">{{ ctaLabel }}</a>
        <a href="work.html" style="padding: 17px 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.75); background: rgba(255,255,255,0.45); backdrop-filter: blur(16px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8); color: #4E2A36; font-size: 15px; font-weight: 600;" style-hover="background: rgba(255,255,255,0.78); box-shadow: 0 10px 26px rgba(78,42,54,0.16);">{{ workLabel }}</a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const EN = {
  kicker: "About the company", pageTitle: "One company. Three specialized divisions.",
  pageLede: "Elegant Middle East delivers integrated solutions across Events, Temporary Structures and Facility Services. By bringing planning, execution, infrastructure and maintenance together, we simplify complex projects through one trusted partner.",
  whyKicker: "Why choose us", whyTitle: "Built for projects that cannot slip.",
  processKicker: "Our process", processTitle: "From client brief to completion, one chain of command.",
  ctaTitle: "One partner. Endless possibilities.", ctaLabel: "Talk to our team", workLabel: "See our work",
  stats: [
    { value: "3", label: "Specialized divisions", icon: "layers-3" },
    { value: "12+", label: "National events delivered", icon: "calendar-check" },
    { value: "24/7", label: "On-site operations cover", icon: "clock" },
    { value: "KSA", label: "Kingdom-wide mobilization", icon: "map-pin" }
  ],
  why: [
    { no: "01", title: "Integrated solutions", body: "Planning, build and operations under one contract and one point of accountability.", icon: "layers" },
    { no: "02", title: "Experienced team", body: "Crews who have delivered national-scale events across the Kingdom.", icon: "users" },
    { no: "03", title: "Quality assurance", body: "Documented standards and inspection at every handover point.", icon: "badge-check" },
    { no: "04", title: "Fast execution", body: "Mobilization and build programmes measured in days, not weeks.", icon: "zap" },
    { no: "05", title: "Safety standards", body: "Engineered structures, certified materials, trained site supervision.", icon: "shield-check" },
    { no: "06", title: "End-to-end management", body: "One team from the first brief to the final dismantle.", icon: "workflow" }
  ],
  steps: [
    { no: "01", title: "Client brief", body: "Objectives, venue constraints and budget captured in one session.", icon: "clipboard-list" },
    { no: "02", title: "Planning", body: "Scope, programme, permits and resourcing set against the date.", icon: "calendar-range" },
    { no: "03", title: "Design", body: "Layouts, structures and brand treatment issued for approval.", icon: "pen-tool" },
    { no: "04", title: "Execution", body: "Manufacture, transport, installation and fit-out on site.", icon: "hammer" },
    { no: "05", title: "Operations", body: "Live running: staffing, cleaning, power, maintenance.", icon: "radio-tower" },
    { no: "06", title: "Completion", body: "Dismantle, site reinstatement and post-project reporting.", icon: "circle-check-big" }
  ],
  values: ["Integrated solutions", "Experienced team", "Quality assurance", "Fast execution", "Safety standards", "End-to-end management"]
};

const AR = {
  kicker: "عن الشركة", pageTitle: "شركة واحدة. ثلاثة أقسام متخصصة.",
  pageLede: "تقدّم شركة إليجنت ميدل إيست حلولاً متكاملة في الفعاليات والمنشآت المؤقتة وخدمات المرافق. من خلال دمج التخطيط والتنفيذ والبنية التحتية والصيانة، نبسّط المشاريع المعقدة عبر شريك واحد موثوق.",
  whyKicker: "لماذا نحن", whyTitle: "مبنيّة لمشاريع لا تقبل التأخير.",
  processKicker: "منهجية العمل", processTitle: "من موجز العميل إلى الإنجاز، بسلسلة قيادة واحدة.",
  ctaTitle: "شريك واحد. إمكانيات لا حدود لها.", ctaLabel: "تواصل مع فريقنا", workLabel: "أعمالنا",
  stats: [
    { value: "3", label: "أقسام متخصصة", icon: "layers-3" },
    { value: "12+", label: "فعالية وطنية منفذة", icon: "calendar-check" },
    { value: "24/7", label: "تشغيل ميداني متواصل", icon: "clock" },
    { value: "السعودية", label: "تغطية على مستوى المملكة", icon: "map-pin" }
  ],
  why: [
    { no: "01", title: "حلول متكاملة", body: "التخطيط والتنفيذ والتشغيل بعقد واحد وجهة مسؤولة واحدة.", icon: "layers" },
    { no: "02", title: "فريق ذو خبرة", body: "فرق نفّذت فعاليات بحجم وطني في مختلف مناطق المملكة.", icon: "users" },
    { no: "03", title: "ضمان الجودة", body: "معايير موثّقة وفحص عند كل مرحلة تسليم.", icon: "badge-check" },
    { no: "04", title: "تنفيذ سريع", body: "برامج تجهيز وتركيب تُقاس بالأيام لا بالأسابيع.", icon: "zap" },
    { no: "05", title: "معايير السلامة", body: "منشآت مهندسة ومواد معتمدة وإشراف ميداني مدرّب.", icon: "shield-check" },
    { no: "06", title: "إدارة شاملة", body: "فريق واحد من الموجز الأول حتى الفك النهائي.", icon: "workflow" }
  ],
  steps: [
    { no: "01", title: "موجز العميل", body: "الأهداف وقيود الموقع والميزانية في جلسة واحدة.", icon: "clipboard-list" },
    { no: "02", title: "التخطيط", body: "النطاق والبرنامج الزمني والتصاريح والموارد.", icon: "calendar-range" },
    { no: "03", title: "التصميم", body: "المخططات والمنشآت والمعالجة البصرية للاعتماد.", icon: "pen-tool" },
    { no: "04", title: "التنفيذ", body: "التصنيع والنقل والتركيب والتجهيز في الموقع.", icon: "hammer" },
    { no: "05", title: "التشغيل", body: "التشغيل الحيّ: الكوادر والنظافة والطاقة والصيانة.", icon: "radio-tower" },
    { no: "06", title: "الإنجاز", body: "الفك وإعادة الموقع والتقرير الختامي.", icon: "circle-check-big" }
  ],
  values: ["حلول متكاملة", "فريق ذو خبرة", "ضمان الجودة", "تنفيذ سريع", "معايير السلامة", "إدارة شاملة"]
};

class Component extends DCLogic {
  state = { lang: (function(){try{var v=localStorage.getItem("eme-lang");return v==="en"||v==="ar"?v:"ar";}catch(e){return "ar";}})() };
  componentDidMount() {
    import('./motion.js').then(m => { this.__motion = m; m.initMotion(document); }).catch(() => {});
    this.icons();
  }

  componentDidUpdate() { if (this.__motion) this.__motion.initMotion(document); this.icons(); }
  icons() { if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} } else setTimeout(() => this.icons(), 200); }
  renderVals() {
    const ar = this.state.lang === "ar";
    const t = ar ? AR : EN;
    const sep = t.values.map(v => v + "  ·");
    return {
      ...t,
      stats: t.stats.map((s) => ({ ...s, size: /^[0-9]/.test(s.value) ? "clamp(40px, 4.6vw, 74px)" : "clamp(26px, 2.6vw, 38px)" })),
      valuesLoop: sep.concat(sep),
      lang: this.state.lang, dir: ar ? "rtl" : "ltr",
      fontStack: ar ? "'IBM Plex Sans Arabic', 'Montserrat', sans-serif" : "'Montserrat', sans-serif",
      headingFont: ar ? "'Readex Pro', sans-serif" : "'Montserrat', sans-serif",
      headLH: ar ? "1.28" : "1.08", bodyLH: ar ? "1.95" : "1.7",
      toggleLang: () => this.setState(s => { const n = s.lang === "ar" ? "en" : "ar"; try { localStorage.setItem("eme-lang", n); } catch (e) {} return { lang: n }; })
    };
  }
}

</script>
</body>
</html>
