  a:hover { color: #BC8565; }
  input, select, textarea { font-family: inherit; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #BC8565; outline-offset: 2px; }

  [data-motion] [data-w][data-in] { opacity: 1; transform: none; }

<div data-page dir="{{ dir }}" style="font-family: {{ fontStack }}; color: #2A1A20; background: transparent; min-height: 100vh;">
  <dc-import name="SiteHeader" lang="{{ lang }}" active="contact" on-toggle-lang="{{ toggleLang }}" hint-size="100%,72px"></dc-import>

  <section style="max-width: 1440px; margin: 0 auto; padding: clamp(34px, 3.6vw, 62px) 40px clamp(24px, 2.6vw, 40px);">
    <p data-reveal style="display: inline-flex; align-items: center; gap: 9px; margin: 0 0 24px; padding: 8px 16px 8px 10px; border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #4E2A36;"><span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: rgba(188,133,101,0.24);"><i data-lucide="mail" style="width: 12px; height: 12px;"></i></span>{{ kicker }}</p>
    <h1 data-split style="text-transform: uppercase; margin: 0; font-size: clamp(32px, 3.8vw, 58px); line-height: {{ headLH }}; font-weight: 300; letter-spacing: -0.04em; color: #4E2A36; max-width: 15ch; font-family: {{ headingFont }}; text-wrap: balance;">{{ pageTitle }}</h1>
    <p data-reveal style="margin: 18px 0 0; font-size: clamp(15px, 1.15vw, 18px); line-height: {{ bodyLH }}; font-weight: 300; color: #5B4650; max-width: 54ch;">{{ pageLede }}</p>
  </section>

  <section style="max-width: 1440px; margin: 0 auto; padding: 0 40px clamp(40px, 4vw, 64px);">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(28px, 4vw, 56px); align-items: start;">

      <div style="min-width: 0; background: rgba(255,255,255,0.55); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 34px rgba(78,42,54,0.10), inset 0 1px 0 rgba(255,255,255,0.85); border-radius: 30px; padding: clamp(20px, 2.2vw, 32px);">
        <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
          <form ref="{{ formRef }}" onSubmit="{{ submit }}">
            <h2 style="margin: 0 0 16px; font-size: clamp(19px, 1.7vw, 24px); font-weight: 400; letter-spacing: -0.02em; color: #4E2A36; font-family: {{ headingFont }}; line-height: 1.3;">{{ formTitle }}</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 13px;">
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fName }}</span>
                <input type="text" name="name" required="{{ isTrue }}" placeholder="{{ phName }}" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fOrg }}</span>
                <input type="text" name="organisation" placeholder="{{ phOrg }}" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fEmail }}</span>
                <input type="email" name="email" required="{{ isTrue }}" placeholder="name@company.sa" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20;">
              </label>
              <label style="position: relative; display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fCountry }}</span>
                <span style="position: absolute; inset-inline-end: 16px; bottom: 13px; display: flex; align-items: center; pointer-events: none; color: #7A5B66;"><i data-lucide="chevron-down" style="width: 17px; height: 17px;"></i></span>
                <select name="country" style="padding: 12px 40px 12px 15px; padding-inline: 15px 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20; appearance: none; -webkit-appearance: none; cursor: pointer;">
                  <sc-for list="{{ countries }}" as="c" hint-placeholder-count="6">
                    <option value="{{ c.value }}">{{ c.label }}</option>
                  </sc-for>
                </select>
              </label>
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fPhone }}</span>
                <input type="tel" name="phone" dir="ltr" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20; text-align: {{ telAlign }};">
              </label>
            </div>

            <p style="margin: 18px 0 9px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fScope }}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
              <sc-for list="{{ scopeOptions }}" as="s" hint-placeholder-count="3">
                <button type="button" sc-camel-on-click="{{ s.onClick }}" style="padding: 9px 17px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(14px); background: {{ s.bg }}; color: {{ s.color }}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;" style-hover="border-color: #4E2A36;">{{ s.label }}</button>
              </sc-for>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 13px; margin-top: 28px;">
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fDate }}</span>
                <input type="date" name="event_date" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20;">
              </label>
              <label style="display: flex; flex-direction: column; gap: 5px;">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fCity }}</span>
                <input type="text" name="city" placeholder="{{ phCity }}" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20;">
              </label>
            </div>

            <label style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px;">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A5B66;">{{ fBrief }}</span>
              <textarea rows="2" name="brief" required="{{ isTrue }}" placeholder="{{ phBrief }}" style="padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); font-size: 15px; color: #2A1A20; resize: vertical;"></textarea>
            </label>

            <button type="submit" disabled="{{ sending }}" style="margin-top: 20px; padding: 14px 32px; border-radius: 999px; border: none; background: #4E2A36; color: #FBF8F6; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;" style-hover="background: #6B3B4A;">{{ submitButtonLabel }}</button>
            <p style="margin: 12px 0 0; font-size: 12px; line-height: 1.6; font-weight: 300; color: #7A5B66;">{{ formNote }}</p>
            <sc-if value="{{ hasError }}">
              <p style="margin: 14px 0 0; padding: 12px 16px; border-radius: 12px; background: rgba(155,42,42,0.08); border: 1px solid rgba(155,42,42,0.25); font-size: 13px; line-height: 1.6; color: #8A2B2B;">{{ errorText }}</p>
            </sc-if>
          </form>
        </sc-if>
        <sc-if value="{{ showSent }}">
          <div style="padding: 40px 0; display: flex; flex-direction: column; gap: 16px; align-items: flex-start;">
            <img src="assets/logo-mark-alt.png" alt="" style="width: 48px; height: 48px; display: block;">
            <h2 style="margin: 0; font-size: clamp(24px, 2.4vw, 34px); font-weight: 400; color: #4E2A36; font-family: {{ headingFont }}; line-height: 1.3;">{{ sentTitle }}</h2>
            <p style="margin: 0; font-size: 16px; line-height: {{ bodyLH }}; font-weight: 300; color: #5B4650; max-width: 40ch;">{{ sentBody }}</p>
            <button sc-camel-on-click="{{ reset }}" style="margin-top: 12px; padding: 14px 28px; border-radius: 999px; border: 1px solid rgba(78,42,54,0.3); background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #4E2A36; cursor: pointer;" style-hover="background: rgba(255,255,255,0.78); box-shadow: 0 10px 26px rgba(78,42,54,0.16);">{{ againLabel }}</button>
          </div>
        </sc-if>
      </div>

      <div style="min-width: 0; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 12px;">
          <sc-for list="{{ channels }}" as="c" hint-placeholder-count="4">
            <a data-reveal href="{{ c.href }}" target="_blank" rel="noopener" style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 18px; border-radius: 18px; background: rgba(255,255,255,0.5); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 30px rgba(78,42,54,0.08), inset 0 1px 0 rgba(255,255,255,0.85);">
              <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; background: rgba(188,133,101,0.18); color: #4E2A36; flex-shrink: 0;"><i data-lucide="{{ c.icon }}" style="width: 17px; height: 17px;"></i></span>
              <span style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
                <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #BC8565;">{{ c.label }}</span>
                <span style="font-size: 14px; font-weight: 500; color: #4E2A36; line-height: 1.35; unicode-bidi: plaintext; overflow-wrap: {{ c.wrap }}; white-space: {{ c.nowrap }};">{{ c.value }}</span>
                <span style="font-size: 12px; font-weight: 300; color: #7A5B66; line-height: 1.45;">{{ c.note }}</span>
              </span>
            </a>
          </sc-for>
        </div>

        <span data-scale style="position: relative; display: block; aspect-ratio: 16 / 9; max-height: 190px; border-radius: 22px; overflow: hidden;"><img src="assets/img-19.jpg" alt="Elegant Middle East reception, Riyadh" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%; display: block;">
        </span>

        <div style="border-radius: 22px; padding: 20px 22px 22px; background: rgba(255,255,255,0.5); backdrop-filter: blur(26px) saturate(175%); -webkit-backdrop-filter: blur(26px) saturate(175%); border: 1px solid rgba(255,255,255,0.72); box-shadow: 0 10px 30px rgba(78,42,54,0.08), inset 0 1px 0 rgba(255,255,255,0.85);">
          <p style="margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #BC8565;">{{ hoursKicker }}</p>
          <sc-for list="{{ hours }}" as="h" hint-placeholder-count="3">
            <div style="display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid rgba(78,42,54,0.12); font-size: 13px; font-weight: 400;">
              <span style="color: #7A5B66;">{{ h.day }}</span>
              <span style="color: #4E2A36; font-weight: 500;">{{ h.time }}</span>
            </div>
          </sc-for>
          <p style="margin: 12px 0 0; font-size: 12px; line-height: 1.6; font-weight: 300; color: #7A5B66;">{{ hoursNote }}</p>
        </div>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>

</x-dc>

    { label: "البريد الإلكتروني", value: "info@elegantmena.com", note: "الطلبات والمنافسات", icon: "mail", href: "mailto:info@elegantmena.com" },
    { label: "لينكدإن", value: "elegant-mena", note: "أخبار الشركة ومشاريعها", icon: "linkedin", href: "https://www.linkedin.com/company/elegant-mena/" }
  ]
};
class Component extends DCLogic {
  state = { lang: (function(){try{var v=localStorage.getItem("eme-lang");return v==="en"||v==="ar"?v:"ar";}catch(e){return "ar";}})(), scope: [], sent: false, sending: false, error: "" };
  formRef = React.createRef();
  componentDidMount() {
    import('./motion.js').then(m => { this.__motion = m; m.initMotion(document); }).catch(() => {});
    this.icons();
  }

  componentDidUpdate() { if (this.__motion) this.__motion.initMotion(document); this.icons(); }
  icons() { if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} } else setTimeout(() => this.icons(), 200); }
  async send(e) {
    if (e && e.preventDefault) e.preventDefault();
    const ar = this.state.lang === "ar";
    const key = (this.props.accessKey || "").trim() || ACCESS_KEY;
    const form = this.formRef.current;
    if (!form) return;
    const data = new FormData(form);
    data.append("access_key", key);
    data.append("subject", "Website enquiry — " + (data.get("organisation") || data.get("name") || "New"));
    data.append("from_name", "Elegant Middle East website");
    data.append("scope", (this.state.scope.map((i) => (ar ? AR : EN).scopeLabels[i]).join(", ")) || "—");
    data.append("language", ar ? "Arabic" : "English");
    if (!key || key.indexOf("PASTE") === 0) {
      this.setState({ error: ar
        ? "لم يتم ضبط مفتاح النموذج بعد. أضف مفتاح Web3Forms لتفعيل الإرسال."
        : "Form key not set yet. Add your Web3Forms access key to enable sending." });
      return;
    }
    this.setState({ sending: true, error: "" });
    try {
      const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: data });
      const out = await res.json();
      if (out && out.success) this.setState({ sent: true, sending: false, error: "" });
      else throw new Error((out && out.message) || "Send failed");
    } catch (err) {
      this.setState({ sending: false, error: ar
        ? "تعذّر الإرسال. يرجى المحاولة مرة أخرى أو مراسلتنا على info@elegantmena.com"
        : "Could not send. Please try again, or email info@elegantmena.com" });
    }
  }
  renderVals() {
    const ar = this.state.lang === "ar";
    const t = ar ? AR : EN;
    const toggle = (i) => () => this.setState(s => ({ scope: s.scope.includes(i) ? s.scope.filter(x => x !== i) : s.scope.concat(i) }));
    return {
      ...t,
      scopeOptions: t.scopeLabels.map((label, i) => ({
        label, onClick: toggle(i),
        bg: this.state.scope.includes(i) ? "#4E2A36" : "transparent",
        color: this.state.scope.includes(i) ? "#FBF8F6" : "#4E2A36"
      })),
      isTrue: true,
      channels: (ar ? AR : EN).channels.map((c) => ({ ...c, wrap: /phone|mail/.test(c.icon) ? "normal" : "break-word", nowrap: /phone|mail/.test(c.icon) ? "nowrap" : "normal" })),
      telAlign: ar ? "right" : "left",
      showForm: !this.state.sent, showSent: this.state.sent,
      formRef: this.formRef,
      sending: this.state.sending,
      submitButtonLabel: this.state.sending ? (ar ? "جارٍ الإرسال…" : "Sending…") : t.submitLabel,
      hasError: !!this.state.error, errorText: this.state.error,
      submit: (e) => this.send(e),
      reset: () => this.setState({ sent: false, scope: [], error: "" }),
      lang: this.state.lang, dir: ar ? "rtl" : "ltr",
      fontStack: ar ? "'IBM Plex Sans Arabic', 'Montserrat', sans-serif" : "'Montserrat', sans-serif",
      headingFont: ar ? "'Readex Pro', sans-serif" : "'Montserrat', sans-serif",
      headLH: ar ? "1.28" : "1.08", bodyLH: ar ? "1.95" : "1.7",
      toggleLang: () => this.setState(s => { const n = s.lang === "ar" ? "en" : "ar"; try { localStorage.setItem("eme-lang", n); } catch (e) {} return { lang: n }; })
    };
  }
}

</script>
</body>
